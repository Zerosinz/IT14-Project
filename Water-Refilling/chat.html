<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Customer Concerns · Roderos Water</title>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Figtree:wght@400;600&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/theme.css" rel="stylesheet">
</head>
<body>
  <div class="cust">
    <h1>Roderos Purified Water Refilling Station</h1>
    <p class="muted mb-0">Message us about gallon cleanliness, delivery or billing. Our staff will reply here.</p>
    <div id="log" class="clog" aria-live="polite"></div>
    <form id="f">
      <label class="form-label" for="name">Your name</label>
      <input id="name" class="form-control mb-2" maxlength="60" required>
      <label class="form-label" for="text">Your message</label>
      <div class="d-flex gap-2">
        <input id="text" class="form-control" maxlength="500" required autocomplete="off">
        <button class="btn btn-primary">Send</button>
      </div>
    </form>
  </div>
  <script>
    const $ = s => document.querySelector(s);
    let sid = localStorage.getItem("rw-sid");
    if (!sid) { sid = "c-" + Math.random().toString(36).slice(2) + Date.now().toString(36); localStorage.setItem("rw-sid", sid); }
    $("#name").value = localStorage.getItem("rw-name") || "";
    async function load() {
      const msgs = await (await fetch("/api/chat/" + sid)).json(), log = $("#log");
      log.replaceChildren();
      if (!msgs.length) { const p = document.createElement("p"); p.className = "muted m-auto"; p.textContent = "No messages yet. Say hello below."; log.append(p); }
      msgs.forEach(m => { const d = document.createElement("div"); d.className = "b" + (m.sender === "customer" ? " me" : ""); d.textContent = m.message; log.append(d); });
      log.scrollTop = log.scrollHeight;
    }
    $("#f").addEventListener("submit", async e => {
      e.preventDefault();
      localStorage.setItem("rw-name", $("#name").value);
      await fetch("/api/chat", { method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ session_id: sid, name: $("#name").value, text: $("#text").value }) });
      $("#text").value = ""; load();
    });
    load(); setInterval(load, 4000);
  </script>
</body>
</html>
