<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Roderos Water Station</title>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Figtree:wght@400;600&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/theme.css" rel="stylesheet">
  <!-- LOGO SPOT 0 (browser tab icon): uses the uploaded logo. Nothing to edit. -->
  <link rel="icon" href="/logo">
</head>
<body>
  <section id="login" class="login">
    <div class="login-tools"><div class="theme-btns">
      <!-- BUTTON 1: switch between light and dark mode -->
      <button type="button" class="icon-btn js-mode" aria-label="Switch between light and dark mode" title="Light / dark mode"><span class="ico"></span></button>
      <!-- BUTTON 2: change the color design (opens a list of 6 palettes) -->
      <div class="pal-wrap">
        <button type="button" class="icon-btn js-color" aria-label="Change color design" aria-expanded="false" title="Change color"><span class="ico"><svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 0 20c1.1 0 2-.9 2-2 0-.5-.2-1-.5-1.3-.3-.3-.5-.8-.5-1.2 0-1.1.9-2 2-2H17a5 5 0 0 0 5-5c0-4.4-4.5-8.5-10-8.5zM6.5 12h.01M9 7h.01M15 7h.01"/></svg></span></button>
        <div class="pal" hidden role="group" aria-label="Color palette"><button type="button" data-t="ocean" aria-pressed="false"><i style="background:#0f6f7c"></i>Ocean</button><button type="button" data-t="azure" aria-pressed="false"><i style="background:#2563eb"></i>Azure</button><button type="button" data-t="emerald" aria-pressed="false"><i style="background:#047857"></i>Emerald</button><button type="button" data-t="violet" aria-pressed="false"><i style="background:#7c3aed"></i>Violet</button><button type="button" data-t="sunset" aria-pressed="false"><i style="background:#c2410c"></i>Sunset</button><button type="button" data-t="rose" aria-pressed="false"><i style="background:#e11d48"></i>Rose</button></div>
      </div>
        </div></div>
    <div class="login-art">
      <!-- ===== LOGO SPOT 1: login screen =====
           Nothing to edit here. Sign in as Owner > Business settings > Upload logo.
           This <img> loads /logo by itself and hides if no logo exists (the droplet jug shows instead).
           To change its size, edit ".logo-big" in theme.css. -->
      <img class="logo-big" src="/logo" alt="Business logo" hidden onload="this.hidden=false" onerror="this.remove()">
      <svg class="jug" viewBox="0 0 120 170" aria-hidden="true">
        <defs><clipPath id="jb"><path d="M16 44a14 14 0 0 1 14-14h60a14 14 0 0 1 14 14v100a14 14 0 0 1-14 14H30a14 14 0 0 1-14-14z"/></clipPath></defs>
        <g clip-path="url(#jb)"><rect class="water" x="0" y="60" width="120" height="120"/></g>
        <path d="M16 44a14 14 0 0 1 14-14h60a14 14 0 0 1 14 14v100a14 14 0 0 1-14 14H30a14 14 0 0 1-14-14z" fill="none" stroke="#9fd9df" stroke-width="3"/>
        <rect x="44" y="6" width="32" height="24" rx="5" fill="none" stroke="#9fd9df" stroke-width="3"/>
        <path d="M104 62q14 0 14 20t-14 20" fill="none" stroke="#9fd9df" stroke-width="3"/>
      </svg>
      <div>
        <h1>Orders, deliveries and gallons in one place.</h1>
        <p>Roderos Purified Water Refilling Station, Visayan Village.</p>
      </div>
    </div>
    <div class="login-form">
      <form id="loginForm">
        <h2 class="h3 mb-1" style="font-family:'Bricolage Grotesque'">Sign in</h2>
        <p class="muted mb-4">Use your staff account.</p>
        <label class="form-label" for="user">Username</label>
        <input id="user" class="form-control mb-3" required autocomplete="username">
        <label class="form-label" for="pass">Password</label>
        <input id="pass" type="password" class="form-control mb-2" required autocomplete="current-password">
        <div id="loginErr" class="text-danger small mb-2" role="alert"></div>
        <button class="btn btn-primary w-100 py-2">Sign in</button>
        <div class="demo" aria-label="Demo accounts">
          <button type="button" data-u="owner" data-p="admin123">Owner</button>
          <button type="button" data-u="staff" data-p="staff123">Staff</button>
          <button type="button" data-u="rider" data-p="rider123">Rider</button>
        </div>
      </form>
    </div>
  </section>

  <div id="app" class="shell" hidden>
    <aside class="side">
      <div class="brand-x"><i><svg viewBox="0 0 24 24"><path d="M12 2.7s7 7.2 7 12.3a7 7 0 0 1-14 0C5 9.9 12 2.7 12 2.7z"/></svg>
        <!-- ===== LOGO SPOT 2: sidebar tile (covers the droplet when a logo exists). Size: ".brand-x i" in theme.css ===== -->
        <img class="logo-img" src="/logo" alt="" onerror="this.remove()"></i>
        <!-- BUSINESS NAME: change the two lines below if the owner wants a different name -->
        <span>Roderos Water<small>Refilling Station</small></span></div>
      <nav id="nav" aria-label="Main"></nav>
      <div class="side-foot">Management system v2.1</div>
    </aside>
    <div class="main-col">
      <header class="topbar">
        <div class="crumb">Home / <b id="crumb"></b></div>
        <div class="theme-btns">
          <!-- BUTTON 1: switch between light and dark mode -->
          <button type="button" class="icon-btn js-mode" aria-label="Switch between light and dark mode" title="Light / dark mode"><span class="ico"></span></button>
          <!-- BUTTON 2: change the color design (opens a list of 6 palettes) -->
          <div class="pal-wrap">
            <button type="button" class="icon-btn js-color" aria-label="Change color design" aria-expanded="false" title="Change color"><span class="ico"><svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 0 20c1.1 0 2-.9 2-2 0-.5-.2-1-.5-1.3-.3-.3-.5-.8-.5-1.2 0-1.1.9-2 2-2H17a5 5 0 0 0 5-5c0-4.4-4.5-8.5-10-8.5zM6.5 12h.01M9 7h.01M15 7h.01"/></svg></span></button>
            <div class="pal" hidden role="group" aria-label="Color palette"><button type="button" data-t="ocean" aria-pressed="false"><i style="background:#0f6f7c"></i>Ocean</button><button type="button" data-t="azure" aria-pressed="false"><i style="background:#2563eb"></i>Azure</button><button type="button" data-t="emerald" aria-pressed="false"><i style="background:#047857"></i>Emerald</button><button type="button" data-t="violet" aria-pressed="false"><i style="background:#7c3aed"></i>Violet</button><button type="button" data-t="sunset" aria-pressed="false"><i style="background:#c2410c"></i>Sunset</button><button type="button" data-t="rose" aria-pressed="false"><i style="background:#e11d48"></i>Rose</button></div>
          </div>
        </div>
        <div class="me"><div class="av" id="av"></div><div><span id="who"></span><small id="role"></small></div></div>
        <button id="logout" class="btn btn-sm btn-outline-primary">Log out</button>
      </header>
      <main id="main" class="content"></main>
    </div>
  </div>
  <div id="toasts" aria-live="polite"></div>
  <script src="/app.js"></script>
</body>
</html>
