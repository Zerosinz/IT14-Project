<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Roderos Water Station</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Figtree:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link href="/theme.css" rel="stylesheet" />
  </head>
  <body>
    <section id="login" class="login">
      <div class="login-art">
        <svg class="jug" viewBox="0 0 120 170" aria-hidden="true">
          <defs>
            <clipPath id="jb">
              <path
                d="M16 44a14 14 0 0 1 14-14h60a14 14 0 0 1 14 14v100a14 14 0 0 1-14 14H30a14 14 0 0 1-14-14z"
              />
            </clipPath>
          </defs>
          <g clip-path="url(#jb)">
            <rect class="water" x="0" y="60" width="120" height="120" />
          </g>
          <path
            d="M16 44a14 14 0 0 1 14-14h60a14 14 0 0 1 14 14v100a14 14 0 0 1-14 14H30a14 14 0 0 1-14-14z"
            fill="none"
            stroke="#9fd9df"
            stroke-width="3"
          />
          <rect
            x="44"
            y="6"
            width="32"
            height="24"
            rx="5"
            fill="none"
            stroke="#9fd9df"
            stroke-width="3"
          />
          <path
            d="M104 62q14 0 14 20t-14 20"
            fill="none"
            stroke="#9fd9df"
            stroke-width="3"
          />
        </svg>
        <div>
          <h1>Orders, deliveries and gallons in one place.</h1>
          <p>Roderos Purified Water Refilling Station, Visayan Village.</p>
        </div>
      </div>
      <div class="login-form">
        <form id="loginForm">
          <h2
            class="h3 mb-1"
            style="font-family: &quot;Bricolage Grotesque&quot;"
          >
            Sign in
          </h2>
          <p class="muted mb-4">Use your staff account.</p>
          <label class="form-label" for="user">Username</label>
          <input
            id="user"
            class="form-control mb-3"
            required
            autocomplete="username"
          />
          <label class="form-label" for="pass">Password</label>
          <input
            id="pass"
            type="password"
            class="form-control mb-2"
            required
            autocomplete="current-password"
          />
          <div id="loginErr" class="text-danger small mb-2" role="alert"></div>
          <button class="btn btn-primary w-100 py-2">Sign in</button>
          <div class="demo" aria-label="Demo accounts">
            <button type="button" data-u="owner" data-p="admin123">
              Owner
            </button>
            <button type="button" data-u="staff" data-p="staff123">
              Staff
            </button>
            <button type="button" data-u="rider" data-p="rider123">
              Rider
            </button>
          </div>
        </form>
      </div>
    </section>

    <div id="app" class="shell" hidden>
      <aside class="side">
        <div class="brand-x">
          <i
            ><svg viewBox="0 0 24 24">
              <path
                d="M12 2.7s7 7.2 7 12.3a7 7 0 0 1-14 0C5 9.9 12 2.7 12 2.7z"
              /></svg></i
          ><span>Roderos Water<small>Refilling Station</small></span>
        </div>
        <nav id="nav" aria-label="Main"></nav>
        <div class="side-foot">Management system v2.1</div>
      </aside>
      <div class="main-col">
        <header class="topbar">
          <div class="crumb">Home / <b id="crumb"></b></div>
          <div class="dots" role="group" aria-label="Color palette">
            <button
              type="button"
              data-t="ocean"
              style="background: #0f6f7c"
              aria-label="ocean palette"
              aria-pressed="false"
            ></button
            ><button
              type="button"
              data-t="azure"
              style="background: #2563eb"
              aria-label="azure palette"
              aria-pressed="false"
            ></button
            ><button
              type="button"
              data-t="emerald"
              style="background: #047857"
              aria-label="emerald palette"
              aria-pressed="false"
            ></button
            ><button
              type="button"
              data-t="violet"
              style="background: #7c3aed"
              aria-label="violet palette"
              aria-pressed="false"
            ></button
            ><button
              type="button"
              data-t="sunset"
              style="background: #c2410c"
              aria-label="sunset palette"
              aria-pressed="false"
            ></button
            ><button
              type="button"
              data-t="rose"
              style="background: #e11d48"
              aria-label="rose palette"
              aria-pressed="false"
            ></button>
          </div>
          <button
            id="mode"
            class="icon-btn"
            aria-label="Toggle dark mode"
            title="Dark mode"
          >
            <span class="ico"
              ><svg viewBox="0 0 24 24">
                <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" /></svg
            ></span>
          </button>
          <div class="me">
            <div class="av" id="av"></div>
            <div><span id="who"></span><small id="role"></small></div>
          </div>
          <button id="logout" class="btn btn-sm btn-outline-primary">
            Log out
          </button>
        </header>
        <main id="main" class="content"></main>
      </div>
    </div>
    <div id="toasts" aria-live="polite"></div>
    <script src="/app.js"></script>
  </body>
</html>
