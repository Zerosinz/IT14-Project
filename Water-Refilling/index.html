<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Water Refilling Station Management System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    :root{--bs-primary:#0b6e8f;--bs-primary-rgb:11,110,143}
    .btn-primary{--bs-btn-bg:#0b6e8f;--bs-btn-border-color:#0b6e8f;--bs-btn-hover-bg:#09566f;--bs-btn-hover-border-color:#09566f;--bs-btn-active-bg:#09566f}
    .topbar{background:#0b3c5d;color:#fff}
    .list-group-item.active{background:#0b6e8f;border-color:#0b6e8f}
    @media print{.topbar,#nav,form,.no-print{display:none!important}}
  </style>
</head>
<body class="bg-light">
  <section id="login" class="container py-5" style="max-width:420px">
    <!-- Insert your logo here -->
    <h1 class="h4 mb-1">Roderos Purified Water Refilling Station</h1>
    <p class="text-muted">Management system. Sign in to continue.</p>
    <form id="loginForm" class="card card-body">
      <label class="form-label">Username<input id="user" class="form-control" required autocomplete="username"></label>
      <label class="form-label">Password<input id="pass" type="password" class="form-control" required autocomplete="current-password"></label>
      <div id="loginErr" class="text-danger small mb-2" role="alert"></div>
      <button class="btn btn-primary">Sign in</button>
    </form>
  </section>

  <div id="app" hidden>
    <header class="topbar d-flex justify-content-between align-items-center px-3 py-2">
      <strong>Roderos Water Refilling Station</strong>
      <span><span id="who" class="me-3 small"></span><button id="logout" class="btn btn-sm btn-outline-light">Log out</button></span>
    </header>
    <div class="container-fluid"><div class="row">
      <nav class="col-md-2 py-3"><div id="nav" class="list-group"></div></nav>
      <main id="main" class="col-md-10 py-3"></main>
    </div></div>
  </div>
  <script src="/app.js"></script>
</body>
</html>
